name: Windows build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zip to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip and attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "amby-${{ inputs.tag }}-windows-x64.zip".Replace("-v", "-")
          New-Item -ItemType Directory amby | Out-Null
          Copy-Item build/windows/x64/runner/Release/* amby -Recurse
          Compress-Archive amby $zip
          gh release upload ${{ inputs.tag }} $zip --clobber
